name: Manga extension compatibility

on:
  workflow_dispatch:
    inputs:
      store_url:
        description: "Extension store index (index.pb, index.min.json or repo.json)"
        required: true
        default: "https://raw.githubusercontent.com/keiyoushi/extensions/repo/index.pb"
      sample_count:
        description: "How many extensions to sample"
        required: true
        default: "40"

permissions:
  contents: read

concurrency:
  group: manga-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Install androguard
        run: pip install "androguard>=4.1,<5"

      - name: Check extensions
        id: check
        continue-on-error: true
        run: |
          python tools/manga-compat/check_compat.py \
            --apk app/build/outputs/apk/debug/app-debug.apk \
            --store-url "${{ inputs.store_url }}" \
            --samples "${{ inputs.sample_count }}"

      - name: Job summary
        if: always()
        run: |
          if [[ -f compat-report.md ]]; then
            cat compat-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manga-compat-report
          path: |
            compat-report.md
            compat-report.json
          if-no-files-found: ignore

      - name: Fail on Mihon core gaps
        if: steps.check.outcome == 'failure'
        run: |
          echo "The sample references members in eu.kanade.tachiyomi. or uy.kohesive.injekt. that this build does not define."
          exit 1
