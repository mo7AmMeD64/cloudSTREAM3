name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Also publish the APK as a GitHub pre-release"
        type: boolean
        default: false

# contents: write is only needed to create a release.
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release APK
        shell: bash # bash with pipefail, so a failed build is not hidden by tee
        run: ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/cloud3STRAM-${GITHUB_RUN_NUMBER}.apk"
          ls -lh dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cloud3STRAM-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            gh release create "${GITHUB_REF_NAME}" dist/*.apk --title "cloud3STRAM ${GITHUB_REF_NAME}" --generate-notes
          else
            gh release create "build-${GITHUB_RUN_NUMBER}" dist/*.apk --target "${GITHUB_SHA}" \
              --title "cloud3STRAM build ${GITHUB_RUN_NUMBER}" --prerelease \
              --notes "First test build. Signed with the debug key."
          fi

      # ---- only when something above failed: make the reason easy to find ----
      - name: Summarize the errors
        if: failure()
        shell: bash
        run: |
          {
            echo "### Build errors"
            echo '```'
            grep -nE "^e: |error:|What went wrong|Execution failed|Could not resolve|FAILED" build.log | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log and reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure
          path: |
            build.log
            **/build/reports/**
          if-no-files-found: ignore
